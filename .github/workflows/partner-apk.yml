name: Build delivery partner APK
on:
  push:
    branches: [main]
    paths: ['partner_app/**', '.github/workflows/partner-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and restore app sources
        run: |
          cp partner_app/pubspec.yaml /tmp/delivery-pubspec.yaml
          cp partner_app/lib/main.dart /tmp/delivery-main.dart
          cp partner_app/icon/ic_delivery_launcher.xml /tmp/ic_delivery_launcher.xml
          cd partner_app
          flutter create --platforms=android --org live.learnwithchampak .
          cp /tmp/delivery-pubspec.yaml pubspec.yaml
          cp /tmp/delivery-main.dart lib/main.dart
          rm -f test/widget_test.dart analysis_options.yaml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="delivery_partner"/android:label="Delivery Partner"/' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp /tmp/ic_delivery_launcher.xml android/app/src/main/res/drawable/ic_delivery_launcher.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_delivery_launcher"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/ic_delivery_launcher"#' android/app/src/main/AndroidManifest.xml || true
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-partner-apk
          path: partner_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish at fixed release URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view partner-apk >/dev/null 2>&1 || gh release create partner-apk --title "Delivery Partner APK" --notes "Latest delivery partner Android build"
          gh release upload partner-apk partner_app/build/app/outputs/flutter-apk/app-release.apk#DeliveryPartner.apk --clobber

